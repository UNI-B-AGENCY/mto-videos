name: render-video
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: render
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q playwright numpy
          python -m playwright install --with-deps chromium >/dev/null
          cd tools/video && npm i -s @fontsource/montserrat @fontsource/poppins @fontsource/inter >/dev/null
      - name: Render queued jobs
        run: python3 tools/video/run_jobs.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "mto-bot"; git config user.email "mto-bot@users.noreply.github.com"
          for f in jobs/done/*.json; do echo "::notice title=$(basename $f)::$(head -c 900 $f | tr '\n' ' ')"; done
          git add -A videos jobs; git commit -qm "Rendered video jobs" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep 5; done
          git status | head -20; exit 1
